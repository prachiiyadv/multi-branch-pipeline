name: Dev Branch CI/CD Pipeline

on:
  push:
    branches:
      - dev

jobs:
  # ==========================
  # 1️⃣ Commit Message Validation
  # ==========================
  validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Commit Message
        run: |
          echo "Last commit message: ${{ github.event.head_commit.message }}"
          MESSAGE="${{ github.event.head_commit.message }}"
          if [[ ! "$MESSAGE" =~ ^(feat:|fix:|docs:) ]]; then
            echo "❌ Commit message is invalid! Must start with feat:, fix: or docs:"
            exit 1
          else
            echo "✅ Commit message is valid!"

  # ==========================
  # 2️⃣ HTML Deployment Simulation
  # ==========================
  deploy-html:
    needs: validate-commit   # Run only if commit validation passes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate HTML File
        run: |
          if [ ! -f index.html ]; then
            echo "❌ index.html not found!"
            exit 1
          fi
          echo "✅ index.html exists"

      - name: Create Deploy Folder
        run: mkdir deploy-folder

      - name: Copy HTML to Deploy Folder
        run: cp index.html deploy-folder/

      - name: Show Deploy Folder Content
        run: ls deploy-folder

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: website-files
          path: deploy-folder/
